name: sync

on:
  push:
    branches: [main]
    paths: ["flwn-design/**", ".github/workflows/sync.yml"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: a-elhaag/flwn-atoms, base: master }
          - { repo: a-elhaag/flwn-ai-engine, base: master }
          - { repo: a-elhaag/flwn-data-engine, base: main }
          - { repo: a-elhaag/flwn-frontend, base: main }
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: dst
      - name: Copy skill
        run: |
          mkdir -p dst/.claude/skills/flwn-design
          rsync -a --delete src/flwn-design/ dst/.claude/skills/flwn-design/
      - name: Open or update PR
        working-directory: dst
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BRANCH: chore/sync-flwn-design
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "already up to date"; exit 0; }
          git config user.name "flwn-design-sync"
          git config user.email "noreply@github.com"
          git checkout -B "$BRANCH"
          git add -A .claude/skills/flwn-design
          git commit -m "Sync flwn-design skill from a-elhaag/flwn-design@${GITHUB_SHA::7}"
          git push -f origin "$BRANCH"
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --base "${{ matrix.base }}" --head "$BRANCH" \
            --title "Sync flwn-design skill" \
            --body "Automatic copy of flwn-design at a-elhaag/flwn-design@${GITHUB_SHA}. Edit the skill in that repo, not here."
